name: Release Please

# Config keys are API for anyone who has pinned this theme, so versions have to mean
# something. release-please reads the Conventional Commit history on main and opens a PR
# that bumps the version and updates CHANGELOG.md; merging that PR cuts the tag and the
# GitHub release.

on:
  push:
    branches: [main]

# Read-only at the top level, write scoped to the job that needs it. A workflow-wide write
# token is handed to every job and every step in it, including any action that gets added
# later; Scorecard's Token-Permissions check scores exactly this.
permissions:
  contents: read

jobs:
  release:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with GITHUB_TOKEN does not trigger `pull_request_target`
      # workflows, which used to leave the required "Conventional Commits" check with no
      # status and every release pull request merge-able only by bypassing the ruleset.
      # `pr-title.yml` runs on `pull_request` for exactly that reason and reports normally;
      # see the comment at the top of it. No bypass, no personal access token and no GitHub
      # App are needed.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
