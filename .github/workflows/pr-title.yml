name: PR Title

# Squash commits inherit the PR title, and release-please reads those commits to work out
# the next version. A title that does not follow Conventional Commits therefore does not
# just look untidy, it silently produces the wrong release. The convention is documented in
# CONTRIBUTING.md.

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  statuses: write

jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is safe here only because nothing is checked out. Never add a
      # checkout step to this workflow: it runs with a writable token against the PR's
      # branch, so checking out fork code would hand that token to the fork.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
