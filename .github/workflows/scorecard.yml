name: Scorecard

# OpenSSF Scorecard grades this repository's own supply-chain posture — token permissions,
# branch protection, dependency pinning, workflow hygiene — and publishes findings to the
# Security tab.
#
# Expect a few points lost on "Pinned-Dependencies": the actions here are pinned to version
# tags rather than commit SHAs, because a readable diff on a dependency bump is worth more
# on a theme than the last few points of a score. That trade is deliberate.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
