name: Deploy exampleSite to GitHub Pages

# The demo site is exampleSite/ built against the theme in this repo — the same thing
# `make build` produces locally, so a broken demo means a broken theme.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel, so a push that lands mid-deploy
# still ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checked out into a directory named after the theme on purpose: Hugo resolves
      # --themesDir relative to --source, so exampleSite/../.. has to be a directory
      # that *contains* a folder called northlight. Same reason the Makefile mounts
      # the repo at /src/northlight.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: northlight

      # Pinned to the version in the Makefile and in theme.toml's min_version. Installed
      # from the official release rather than a third-party action so there is one less
      # thing between the tag and the binary.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.164.0
        run: |
          curl -sSLo hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # --panicOnWarning is the same gate as `make check`. A warning that would fail
      # locally should fail here rather than publish quietly.
      - name: Build
        run: |
          hugo \
            --source northlight/exampleSite \
            --themesDir ../.. \
            --minify --gc --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # The same suite `make check` runs locally. A green build is not enough: Hugo
      # renders broken layouts happily, so this asserts the output is actually right.
      - name: Test
        run: sh northlight/tests/run.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: northlight/exampleSite/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
