# Every string the theme puts on screen. Nothing user-facing is hardcoded in a
# template, so translating the theme means copying this file to your language code
# (i18n/de.toml, i18n/nb.toml) and translating the values. Nothing else changes.
#
# Placeholders: {{ . }} is the value passed to the call. Keep it in the translation.
#
# ORDERING MATTERS. In TOML, every bare key after a [table] header belongs to that
# table, so the pluralised entries are all at the bottom. Adding a simple key below
# them silently makes it part of the last table and the build fails with "reserved
# keys mixed with unreserved keys".

# --- Chrome -------------------------------------------------------------------
skipToContent = "Skip to content"
mainNavigation = "Main"
footerNavigation = "Footer"
backToTop = "Back to top"
switchColourMode = "Switch colour mode"
switchToDarkMode = "Switch to dark mode"
switchToLightMode = "Switch to light mode"

# --- Search -------------------------------------------------------------------
searchPosts = "Search posts"
searchPlaceholder = "Search posts, tags…"
searchResults = "Search results"
closeSearch = "Close search"
escapeKey = "Esc"

# --- Article ------------------------------------------------------------------
draft = "Draft"
onThisPage = "On this page"
readNext = "Read next"
share = "Share"
comments = "Comments"
commentsRequireJavaScript = "Comments require JavaScript."
linkToSection = "Link to this section"
table = "Table"
breadcrumb = "Breadcrumb"
postNavigation = "Post navigation"
older = "Older"
newer = "Newer"
editThisPage = "Edit this page"
externalPost = "Read on the original site"

# --- Lists and taxonomies -----------------------------------------------------
featured = "Featured"
recentPosts = "Recent posts"
allPosts = "All posts"
home = "Home"
tagged = "Tagged"
noTagsYet = "No tags yet."
pageNotFound = "This page does not exist."
pageNotFoundHelp = "The link may be out of date, or the page may have moved. The posts are all still here."

# --- Pagination ---------------------------------------------------------------
pagination = "Pagination"
previousPage = "Previous page"
nextPage = "Next page"

# --- Code blocks --------------------------------------------------------------
copy = "Copy"
copied = "Copied"
copyFailed = "Failed"
copyCodeToClipboard = "Copy code to clipboard"
codeCopiedToClipboard = "Code copied to clipboard"

# --- Footer -------------------------------------------------------------------
# Both names arrive as values rather than being concatenated in the template, so a
# language can put them in whatever order it wants. .Hugo is always a link; .Theme is
# a link only when the site sets footer.themeURL, and plain text otherwise.
builtWith = "built with {{ .Hugo }} and the {{ .Theme }} theme"

# The theme's own name. Separate from builtWith so a translation can transliterate it
# without having to rebuild the sentence around it.
themeName = "Northlight"

# Accessible name for the carousel's scroll container. It is a focusable region, so it
# needs a name; without one a screen reader announces an unlabelled group.
carousel = "Image carousel"

# The facade on a lite YouTube embed. Says where the click goes, because it leaves the
# site: with scripting off the facade is a plain link to YouTube.
watchOnYouTube = "Watch on YouTube"

# The fallback inside a self-hosted <video>, shown only by a browser that cannot play
# the file. A download link rather than an apology, because such a browser can still
# hand the file to something that can play it.
downloadVideo = "Download the video"

# The lightbox. Both strings only exist after a click, so they are rendered into the JSON
# block in baseof.html and read at runtime rather than into the markup.
viewFullSize = "View full size"
closeLightbox = "Close image"

# The underline-links control. Named for what it does rather than as an "accessibility
# mode": a control whose effect a reader cannot predict is not an accessibility feature.
underlineLinks = "Underline links"

# Accessible name for the language switcher. The visible text is the current language's
# own name, which says what is selected but not what the control does.
changeLanguage = "Change language"

# Separator between co-author names in a byline. A key rather than a literal comma,
# because the punctuation between names is not the same in every language, and neither
# is the spacing around it.
authorSeparator = ", "

# The summary line on a multi-part series. Takes .Part, .Total and .Series, so a
# translation controls the whole sentence rather than being handed three fragments to
# reassemble in an order its grammar may not allow.
seriesPart = "Part {{ .Part }} of {{ .Total }} in {{ .Series }}"

# The reply-by-email link at the foot of an article. An invitation rather than a label,
# because it is asking for something: the quiet alternative to a comment box.
replyByEmail = "Reply by email"

# Accessible name for each sharing link. The visible text is only the service name, which
# out of context reads as a link to that service rather than an action, so the button
# carries this as its aria-label. Takes the service name as its value.
shareOn = "Share on {{ . }}"

# The same, for the mail option — the destination is the reader's own mail client.
shareByEmail = "Share by email"

# Service names, used by both the sharing row and the social links beside an author.
# They live here rather than being title-cased from the config key for two reasons:
# `title` turns "linkedin" into "Linkedin" and "hackernews" into "Hackernews", both of
# which are wrong; and a translation may need to transliterate a name, which is the same
# reason `themeName` is a key rather than a literal. These are proper nouns, so most
# translations will leave them untouched.
#
# A name with no key here falls back to title-casing, so adding an icon does not oblige
# anyone to add a string before it can be used.
serviceNameLinkedin = "LinkedIn"
serviceNameReddit = "Reddit"
serviceNameMastodon = "Mastodon"
serviceNameBluesky = "Bluesky"
serviceNameHackernews = "Hacker News"
serviceNameEmail = "Email"
serviceNameX = "X"
serviceNameFacebook = "Facebook"
serviceNameTelegram = "Telegram"
serviceNameWhatsapp = "WhatsApp"
serviceNamePinterest = "Pinterest"
serviceNameGithub = "GitHub"
serviceNameRss = "RSS"
serviceNameLink = "Website"

# --- Pluralised. Keep these last; see the note at the top. --------------------
[readingTime]
one = "{{ . }} min read"
other = "{{ . }} min read"

# .Formatted carries the thousands separator; .Count drives pluralisation.
[wordCount]
one = "{{ .Formatted }} word"
other = "{{ .Formatted }} words"

[updatedOn]
other = "Updated {{ . }}"

[postCount]
one = "{{ . }} post"
other = "{{ . }} posts"

[allNPosts]
one = "All {{ . }} post"
other = "All {{ . }} posts"
