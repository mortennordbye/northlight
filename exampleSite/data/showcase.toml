# Sites built with Northlight, rendered by exampleSite/layouts/showcase/section.html
# onto /showcase/.
#
# Adding yours: append a [[sites]] block and open a pull request. Entries render in the
# order they appear here, so add to the bottom rather than the top.
#
#   name         what to call the site — its domain or its title (required)
#   url          where it lives, absolute and including the scheme (required)
#   author       who runs it (required)
#   description  one sentence about what it covers (required)
#
# All four are required and the layout fails the build if one is missing, so a PR that
# forgets a field is caught by `make check` rather than by a reader finding a card with
# no author on it.
#
# Nothing here is fetched at build time or by the reader — the card is the four values
# below and nothing else. That keeps the promise the theme makes everywhere else: no
# third-party requests unless a site asks for them.

[[sites]]
  name = "blog.nordbye.it"
  url = "https://blog.nordbye.it"
  author = "Morten Victor Nordbye"
  description = "Kubernetes, cloud infrastructure and homelab notes, written from the things that actually broke."
