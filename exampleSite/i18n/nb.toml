# --- Sharing ------------------------------------------------------------------
shareOn = "Del på {{ . }}"
shareByEmail = "Del med e-post"
# The serviceName* keys are proper nouns and are deliberately not translated. They fall
# back to the theme's English, which is the correct result for a brand name.

