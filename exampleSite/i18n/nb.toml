# Norwegian Bokmål, as the demo site's second language.
#
# This lives in the *site's* i18n/, not the theme's, which is the path documented on the
# Translating page: copy the theme's en.toml here and translate the values. The site's
# catalogue wins over the theme's, and any key left out falls back to the theme's English,
# so a partial translation degrades one string at a time.
#
# Ordering matters: in TOML every bare key after a [table] header belongs to that table,
# so the pluralised entries stay at the bottom.

# --- Chrome -------------------------------------------------------------------
skipToContent = "Hopp til innhold"
mainNavigation = "Hovedmeny"
footerNavigation = "Bunnmeny"
backToTop = "Til toppen"
switchColourMode = "Bytt fargemodus"
switchToDarkMode = "Bytt til mørk modus"
switchToLightMode = "Bytt til lys modus"
changeLanguage = "Bytt språk"

