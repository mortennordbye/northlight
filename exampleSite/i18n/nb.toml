escapeKey = "Esc"
searchHintNavigate = "naviger"
searchHintOpen = "åpne"
searchHintClose = "lukk"
# The %s placeholder is filled in by search.js; keep it in the translation.
searchNoResults = "Ingen innlegg samsvarer med «{{ . }}»."
readingTimeShort = "{{ . }} min"

