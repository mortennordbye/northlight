<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="">
  <!-- A deliberately quiet backdrop for the `background` home layout demo.

       Flat fills and hairlines, no gradient, no photograph, nothing with baked-in
       type. A backdrop for this theme has one job: sit behind text without
       competing with it. The first thing tried here was a post cover, which has
       its own title in the artwork and collided with the page heading — which is
       exactly the failure the documentation warns about. -->
  <rect width="1600" height="900" fill="#12121a"/>
  <g stroke="#1e1e2b" stroke-width="1">
    <path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/>
    <path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/>
  </g>
  <g fill="#181826">
    <circle cx="1280" cy="220" r="190"/>
    <circle cx="330" cy="700" r="150"/>
  </g>
  <g stroke="#252537" stroke-width="2" fill="none">
    <path d="M980 640h420M980 690h300M980 740h360"/>
  </g>
</svg>
