{{ define "main" }}
<div class="wrap notfound">
  <p class="eyebrow">404</p>
  <h1 class="notfound-title">{{ i18n "pageNotFound" }}</h1>
  <p class="notfound-text">
    {{ i18n "pageNotFoundHelp" }}
  </p>
  <div class="notfound-actions">
    <a class="button" href="{{ site.Home.RelPermalink }}">{{ i18n "home" }}</a>
    {{- with site.Params.mainSections }}
      {{- with site.GetPage (printf "/%s" (index . 0)) }}
        <a class="button" href="{{ .RelPermalink }}">{{ i18n "allPosts" }}</a>
      {{- end }}
    {{- end }}
  </div>
</div>
{{ end }}
