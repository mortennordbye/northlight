{{- $cfg := partialCached "init.html" . -}}
<!doctype html>
<html lang="{{ site.Language.Lang }}"
      data-palette="{{ $cfg.palette }}"
      data-appearance-default="{{ $cfg.defaultAppearance }}"
      data-appearance-auto="{{ $cfg.autoSwitchAppearance }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
