{{ define "main" }}
  <h1>{{ site.Title }}</h1>
  {{ with site.Params.description }}<p>{{ . }}</p>{{ end }}
  {{ .Content }}
  <ul>
    {{ range where site.RegularPages "Section" "in" site.Params.mainSections }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
{{ end }}
